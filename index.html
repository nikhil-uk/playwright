.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 -16px;padding:12px 16px 8px;background:var(--bg)}
.logo{font-size:1.45rem;cursor:pointer;display:flex;align-items:center;gap:8px}

.stats{display:flex;gap:8px;align-items:center}.pill{border:2.5px solid var(--line);border-radius:999px;padding:1px 12px;font-weight:600;font-size:.88rem;background:var(--paper)}

.hero{background:var(--hero);color:#fff;border:2.5px solid var(--line);border-radius:30px;padding:24px;margin:8px 0 14px}

.mosaic i{aspect-ratio:1;border-radius:8px;border:2px solid #ffffff55}.mosaic i.d{background:var(--mint);border-color:var(--mint)}.mosaic i.s3{background:var(--sun);border-color:var(--sun)}

.act.t{background:var(--tsun)}.act.i{background:var(--tcoral)}.act p{color:#3a3a5c}

button:focus-visible,.node:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.unit{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;margin:26px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.node{display:flex;flex-direction:column;gap:4px;margin:0;padding:14px;background:var(--t,var(--tviolet));color:#12122a;border:2.5px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--sh);cursor:pointer;transition:transform .1s}

.node.done .ic{background:var(--mint)}.node.lock{background:var(--paper);color:var(--dim);border-style:dashed;box-shadow:none;cursor:not-allowed;transform:none}.node.lock .ic{background:transparent;border-color:var(--line);filter:grayscale(1)}

.stars{letter-spacing:2px;font-size:1.05rem}

.chip{background:var(--a);color:#fff;border:2.5px solid var(--line);border-radius:999px;padding:1px 14px;font-weight:700;font-size:.85rem}
.puz{border-top:10px solid var(--a)}
.tile{font:inherit;display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0;cursor:pointer;box-shadow:0 3px 0 var(--sh);transition:transform .08s}

.tile.on{background:var(--tsky);color:#12122a}.tile.sm{display:inline-block;width:auto;min-width:48px;text-align:center;margin:5px;font-weight:700;font-size:1.15rem}
.slot{border:2.5px dashed var(--line);border-radius:16px;padding:10px 14px;margin:8px 0;color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col .tile{font-size:.93rem}
.code{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px;overflow-x:auto}
.line{font:inherit;display:flex;gap:10px;width:100%;background:transparent;color:var(--ink);border:2.5px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;white-space:pre}
.line i{color:var(--dim);font-style:normal;width:1.4em}.line code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85rem}
.line:hover{border-color:var(--a)}.line.ok{background:var(--tmint);border-color:#12122a;color:#12122a}.line.bad{background:var(--tcoral);border-color:#12122a;color:#12122a}
.built{display:flex;gap:7px;margin:10px 0}.cell{width:46px;height:52px;border:2.5px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:1.35rem;font-weight:800;background:var(--tsun);color:#12122a}
.fb.good,.fb.miss,.fb.hint{border:2.5px solid #12122a;border-radius:16px;padding:10px 14px;margin-top:12px;color:#12122a}
.fb.good{background:var(--tmint)}.fb.miss{background:var(--tcoral)}.fb.hint{background:var(--tsun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--sun);color:#12122a;border:2.5px solid #12122a;padding:6px 18px;border-radius:999px;font-weight:800;z-index:9;box-shadow:0 4px 0 #12122a}
.big{font-size:3rem;text-align:center;margin:0}
.cf{position:fixed;top:-14px;width:10px;height:15px;border-radius:3px;z-index:8;animation:fall 1.9s ease-in forwards}
.foot{max-width:820px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--dim);font-size:.9rem;border-top:2.5px solid var(--line)}.foot b{color:var(--ink)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
@media (max-width:560px){.cols,.acts{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
